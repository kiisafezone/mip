name: Android CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify shared core and run tests, lint, and Android build
        run: >-
          ./gradlew --no-daemon
          verifySharedCoreNoAndroidImports
          :shared:domain:allTests
          :shared:contracts:allTests
          :shared:engine:allTests
          :apps:android:testDebugUnitTest
          :apps:android:lintDebug
          assembleDebug
