name: Android CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test (JDK 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install pinned Android SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Verify shared core and run unit tests, lint, and Android build
        run: >-
          ./gradlew --no-daemon
          verifySharedCoreNoAndroidImports
          :shared:domain:allTests
          :shared:contracts:allTests
          :shared:engine:allTests
          :data:local:testDebugUnitTest
          :apps:android:testDebugUnitTest
          :apps:android:lintDebug
          assembleDebug

      - name: Run Room persistence instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          script: ./gradlew --no-daemon :data:local:connectedDebugAndroidTest
